services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Run scripts/start-local.sh}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 15
    volumes:
      - database:/var/lib/mysql
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Run scripts/start-local.sh}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WPLANG', 'ja' );
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/themes/umimori365:/var/www/html/wp-content/themes/umimori365:ro
      - ./scripts/local-mail.php:/var/www/html/wp-content/mu-plugins/umimori-local-mail.php:ro
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  wordpress:
  database:
